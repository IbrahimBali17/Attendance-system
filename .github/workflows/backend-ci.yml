name: Backend CI
on:
  push: { paths: ["backend/**", ".github/workflows/backend-ci.yml"] }
  pull_request: { paths: ["backend/**"] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: "backend/tests/**/TestResults/*.trx" }
  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t attendance-api:${{ github.sha }} ./backend
