name: Dashboard CI + E2E
on:
  push: { paths: ["dashboard/**", "e2e/**", "backend/**", ".github/workflows/dashboard-ci.yml"] }
  pull_request: { paths: ["dashboard/**", "e2e/**"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run build
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Start API stack
        run: docker compose up -d --build --wait
      - name: Build + serve dashboard
        working-directory: dashboard
        run: |
          npm ci
          VITE_API_URL=http://localhost:8080 npm run build
          nohup npm run preview > preview.log 2>&1 &
          npx --yes wait-on http://localhost:4173
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report }
      - if: always()
        run: docker compose down -v
